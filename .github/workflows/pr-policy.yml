name: PR policy

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review, converted_to_draft]
  merge_group:

permissions:
  contents: read

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate branch name
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: ./scripts/check-branch-name.sh "$BRANCH_NAME"

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: ./scripts/check-pr-title.sh "$PR_TITLE"

      - name: Validate task and issue contract
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_READY: ${{ github.event.pull_request.draft == false }}
        run: ./scripts/task-sync.sh validate-pr

      - name: Merge queue compatibility
        if: github.event_name == 'merge_group'
        run: echo "PR title, task state, and issue contract were validated before queue entry; reporting success for merge_group."

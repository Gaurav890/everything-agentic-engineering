name: Web quality

on:
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: Generate Linux baseline candidates for human review
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/design-tokens/**"
      - "scripts/build_design_tokens.py"
      - "scripts/web_verification.py"
      - "scripts/project_checks.py"
      - "scripts/next_action.py"
      - "scripts/project_generator.py"
      - "scripts/project_brief.py"
      - "scripts/project_handoff.py"
      - "scripts/design_engine.py"
      - "tests/fixtures/onboarding/**"
      - "scripts/verify.sh"
      - "tests/test_web_verification.py"
      - "tests/test_next_action.py"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-quality.yml"
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  web-quality:
    name: web-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify repository, web build, interaction, and accessibility
        run: ./agentic verify web

      - name: Verify a fresh personalized project and custom preview
        run: |
          ONBOARDING_ROOT="$(mktemp -d "$RUNNER_TEMP/eae-onboarding.XXXXXX")"
          ./agentic setup create --name "First Project" \
            --destination "$ONBOARDING_ROOT/project" --preset web \
            --archetype agentic-product --audience "People comparing purchase dates" \
            --promise "Understand the tradeoff before deciding." \
            --first-outcome "Compare two purchase dates" --assistant manual --yes
          mkdir -p "$ONBOARDING_ROOT/project/apps/web/app/concepts/purchase-path"
          cp tests/fixtures/onboarding/purchase-path.tsx "$ONBOARDING_ROOT/project/apps/web/app/concepts/purchase-path/page.tsx"
          cp tests/fixtures/onboarding/purchase-path.json "$ONBOARDING_ROOT/project/purchase-path.json"
          cp tests/fixtures/onboarding/purchase-path.spec.ts "$ONBOARDING_ROOT/project/apps/web/tests/purchase-path.spec.ts"
          cd "$ONBOARDING_ROOT/project"
          ./agentic start --json
          ./agentic design propose --file purchase-path.json --yes
          pnpm install --offline --frozen-lockfile --ignore-scripts
          pnpm --dir apps/web build
          ONBOARDING_TEST_PROJECT=1 pnpm --dir apps/web exec playwright test onboarding.spec.ts purchase-path.spec.ts --workers=1

      - name: Detect approved Linux baselines
        id: baselines
        working-directory: apps/web
        shell: bash
        run: |
          if find tests -type f -path '*-snapshots/*-linux.png' -print -quit 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare approved visual baselines
        if: >-
          steps.baselines.outputs.present == 'true' &&
          !(github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines)
        run: ./agentic verify visual

      - name: Generate visual baseline candidates
        if: >-
          steps.baselines.outputs.present != 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines)
        working-directory: apps/web
        run: pnpm test:visual:update

      - name: Upload visual baseline candidates
        if: >-
          steps.baselines.outputs.present != 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines)
        uses: actions/upload-artifact@v4
        with:
          name: web-visual-baselines-linux
          path: apps/web/tests/**/*-snapshots/
          if-no-files-found: error
          retention-days: 7

      - name: Require reviewed baselines
        if: >-
          steps.baselines.outputs.present != 'true' &&
          !(github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines)
        run: |
          echo "::error::No approved Linux visual baselines are committed. Review the web-visual-baselines-linux artifact, commit approved images, and rerun CI."
          exit 1

      - name: Upload visual failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-visual-failure
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
            ${{ runner.temp }}/eae-onboarding.*/project/apps/web/test-results/
            ${{ runner.temp }}/eae-onboarding.*/project/apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

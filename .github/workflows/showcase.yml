name: Showcase

on:
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: Generate Linux baseline candidates for human review
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main]
    paths:
      - "apps/showcase/**"
      - "packages/design-tokens/**"
      - "scripts/build_design_tokens.py"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/showcase.yml"
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  build-and-e2e:
    name: showcase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build showcase
        run: pnpm build

      - name: Install browser
        working-directory: apps/showcase
        run: pnpm exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ../../.cache/ms-playwright

      - name: Run interaction and accessibility tests
        working-directory: apps/showcase
        run: pnpm test:e2e

      - name: Compare approved visual baselines
        if: >-
          !(github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines)
        working-directory: apps/showcase
        run: pnpm test:visual

      - name: Generate visual baseline candidates
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines
        working-directory: apps/showcase
        run: pnpm test:visual:update

      - name: Upload visual baseline candidates
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines
        uses: actions/upload-artifact@v4
        with:
          name: showcase-visual-baselines-linux
          path: apps/showcase/tests/visual.spec.ts-snapshots/
          retention-days: 7

      - name: Upload visual failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-visual-failure
          path: apps/showcase/test-results/
          if-no-files-found: ignore
          retention-days: 7

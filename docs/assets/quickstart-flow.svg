<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Everything Agentic Engineering quick-start flow</title>
  <desc id="desc">A five-step flow from cloning the repository through configuring a project and planning an isolated task workspace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111b33"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="52" r="180" fill="#37d6a3" opacity=".07"/>
  <circle cx="112" cy="390" r="210" fill="#67a9ff" opacity=".06"/>
  <text x="64" y="76" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="700">From clone to an agent-ready task</text>
  <text x="64" y="110" fill="#a8b3c7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">One guided path. Only the capabilities your project needs. No silent installs or merges.</text>
  <g filter="url(#shadow)" font-family="ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(64 162)">
      <rect width="190" height="154" rx="18" fill="#151f35" stroke="#2b3a59"/>
      <circle cx="30" cy="30" r="16" fill="#67a9ff"/><text x="30" y="36" fill="#07111f" font-size="16" font-weight="800" text-anchor="middle">1</text>
      <text x="24" y="82" fill="#f8fafc" font-size="21" font-weight="700">Clone</text>
      <text x="24" y="110" fill="#a8b3c7" font-size="14">Durable context,</text>
      <text x="24" y="132" fill="#a8b3c7" font-size="14">agents, skills, gates</text>
    </g>
    <g transform="translate(283 162)">
      <rect width="190" height="154" rx="18" fill="#151f35" stroke="#2b3a59"/>
      <circle cx="30" cy="30" r="16" fill="#67a9ff"/><text x="30" y="36" fill="#07111f" font-size="16" font-weight="800" text-anchor="middle">2</text>
      <text x="24" y="82" fill="#f8fafc" font-size="21" font-weight="700">Bootstrap</text>
      <text x="24" y="110" fill="#a8b3c7" font-size="14">Validate the local</text>
      <text x="24" y="132" fill="#a8b3c7" font-size="14">environment safely</text>
    </g>
    <g transform="translate(502 162)">
      <rect width="190" height="154" rx="18" fill="#151f35" stroke="#2b3a59"/>
      <circle cx="30" cy="30" r="16" fill="#37d6a3"/><text x="30" y="36" fill="#04140e" font-size="16" font-weight="800" text-anchor="middle">3</text>
      <text x="24" y="82" fill="#f8fafc" font-size="21" font-weight="700">Configure</text>
      <text x="24" y="110" fill="#a8b3c7" font-size="14">Choose a profile;</text>
      <text x="24" y="132" fill="#a8b3c7" font-size="14">preview inactive tools</text>
    </g>
    <g transform="translate(721 162)">
      <rect width="190" height="154" rx="18" fill="#151f35" stroke="#2b3a59"/>
      <circle cx="30" cy="30" r="16" fill="#37d6a3"/><text x="30" y="36" fill="#04140e" font-size="16" font-weight="800" text-anchor="middle">4</text>
      <text x="24" y="82" fill="#f8fafc" font-size="21" font-weight="700">Plan</text>
      <text x="24" y="110" fill="#a8b3c7" font-size="14">Check dependencies,</text>
      <text x="24" y="132" fill="#a8b3c7" font-size="14">ownership, and gates</text>
    </g>
    <g transform="translate(940 162)">
      <rect width="196" height="154" rx="18" fill="#17263a" stroke="#37d6a3"/>
      <circle cx="30" cy="30" r="16" fill="#37d6a3"/><text x="30" y="36" fill="#04140e" font-size="16" font-weight="800" text-anchor="middle">5</text>
      <text x="24" y="82" fill="#f8fafc" font-size="21" font-weight="700">Start safely</text>
      <text x="24" y="110" fill="#a8b3c7" font-size="14">Confirm a branch or</text>
      <text x="24" y="132" fill="#a8b3c7" font-size="14">isolated worktree</text>
    </g>
  </g>
  <g stroke="#55708f" stroke-width="2" fill="none">
    <path d="M254 239h29"/><path d="m275 232 8 7-8 7"/>
    <path d="M473 239h29"/><path d="m494 232 8 7-8 7"/>
    <path d="M692 239h29"/><path d="m713 232 8 7-8 7"/>
    <path d="M911 239h29"/><path d="m932 232 8 7-8 7"/>
  </g>
  <text x="64" y="374" fill="#718096" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">bootstrap → init-project → profile-doctor → task-plan → task-start --yes</text>
</svg>
